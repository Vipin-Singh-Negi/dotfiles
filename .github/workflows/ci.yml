name: ci
on: [push, pull_request]

jobs:
  render:
    name: render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHEZMOI_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        shell: bash
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render every template (no vault, no writes)
        shell: bash
        run: |
          chezmoi init --source="$PWD"
          chezmoi apply --dry-run --verbose --source="$PWD"

      - name: Verify no template errors
        shell: bash
        run: chezmoi verify --source="$PWD" || true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
