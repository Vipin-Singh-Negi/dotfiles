title = "dotfiles gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Template placeholders are not secrets"
regexTargets = ["match"]
regexes = [
  '''CI_PLACEHOLDER''',
  '''age1REPLACE_ME_WITH_YOUR_PUBLIC_KEY''',
  '''includeTemplate "secret"''',
]
paths = [
  '''\.chezmoitemplates/secret''',
]
